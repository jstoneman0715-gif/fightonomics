<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#131316"/>
      <rect width="8" height="16" fill="#17171b"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#stripes)"/>
  <circle cx="200" cy="160" r="135" fill="none" stroke="#d4a24e" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="200" cy="160" r="100" fill="none" stroke="#e0263e" stroke-opacity="0.12" stroke-width="2"/>

  <!-- title belt motif -->
  <rect x="150" y="18" width="100" height="26" rx="6" fill="#d4a24e" opacity="0.85"/>
  <rect x="182" y="14" width="36" height="34" rx="5" fill="#e0263e" opacity="0.9"/>
  <text x="200" y="36" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#0b0b0d" text-anchor="middle" letter-spacing="1">WW TITLE</text>

  <!-- Makhachev: crouched wrestling stance -->
  <g fill="#e0263e" transform="translate(15,120) scale(1.05)">
    <circle cx="60" cy="45" r="13"/>
    <polygon points="40,55 78,55 88,90 70,110 46,108 34,88"/>
    <polygon points="46,108 36,108 20,150 34,156 54,112"/>
    <polygon points="70,110 82,108 100,145 114,152 96,156 78,112"/>
    <polygon points="42,60 26,66 10,95 22,102 40,72"/>
    <polygon points="78,60 96,64 114,90 102,98 82,70"/>
  </g>

  <!-- Machado Garry: tall long-range striker stance, mirrored -->
  <g fill="#d4a24e" transform="translate(385,80) scale(-1,1)">
    <circle cx="70" cy="16" r="11"/>
    <polygon points="57,26 83,26 89,80 76,102 54,102 45,80"/>
    <polygon points="54,102 47,102 24,168 36,173 58,108"/>
    <polygon points="76,102 85,102 96,150 108,175 92,178 78,110"/>
    <polygon points="55,30 45,27 36,42 44,50 56,40"/>
    <polygon points="82,28 105,20 135,8 140,17 110,32 88,38"/>
    <circle cx="136" cy="13" r="8"/>
    <circle cx="40" cy="46" r="7"/>
  </g>

  <text x="200" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f3f3f2" text-anchor="middle" letter-spacing="3">VS</text>

  <rect x="0" y="292" width="120" height="8" fill="#e0263e"/>
  <rect x="280" y="292" width="120" height="8" fill="#d4a24e"/>
</svg>
